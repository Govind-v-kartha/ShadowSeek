[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "user-scanner"
version = "1.6.0"
description = "Shadowseek - Advanced OSINT User & Email Reconnaissance across 150+ platforms"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "govind"}
]

dependencies = [
  "httpx[http2]>=0.27,<0.29",
  "socksio>=1.0,<2",
  "colorama>=0.4,<1",
  "curl_cffi>=0.7,<1",
  "rich>=13.0.0"
]

requires-python = ">=3.10"
keywords = ["osint", "email-osint", "username-osint", "python", "cli-tool", "cybersecurity", "threat-intelligence", "security"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-anyio", "anyio[trio]"]
pdf = ["reportlab>=4.0.0", "pillow>=10.0.0", "svglib>=1.5.0"]
mcp = ["mcp>=1.2.0,<2"]

[project.urls]
Homepage = "https://github.com/Govind-v-kartha/ShadowSeek"
Repository = "https://github.com/Govind-v-kartha/ShadowSeek"

[project.scripts]
shadowseek = "user_scanner.__main__:main"
Shadowseek = "user_scanner.__main__:main"
shadowseek-mcp = "user_scanner.mcp.server:main"
osint = "user_scanner.__main__:main"
OSINT = "user_scanner.__main__:main"
user-scanner = "user_scanner.__main__:main"
user-scanner-mcp = "user_scanner.mcp.server:main"

[tool.flit.module]
name = "user_scanner"

[tool.flit.sdist]
exclude = [
  "tests/",
  "docs/",
  ".github/",
  ".git",
  ".gitignore",
  ".ruff_cache/",
  "**/.ruff_cache/**",
  "__pycache__/",
  "**/__pycache__/**",
  "*.pyc",
  "rm_pycache.py",
  "che.py"
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["E701", "E401"]
